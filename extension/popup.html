<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thought Drawer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/split/WantedSansVariable.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="top">
    <svg class="logo" width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
      <g transform="rotate(-12 30 8)"><rect x="24" y="2.6" width="12" height="11" rx="1.6" fill="#ffd84a"/><path d="M26.6 6.4h6.6M26.6 9.4h4.2" stroke="#d9a400" stroke-width="1.3" stroke-linecap="round"/></g>
      <path d="M6.8 27.2q-3 1.1-3.4 4.6M41.2 27.2q3 1.1 3.4 4.6" stroke="var(--m-deep)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <rect x="12.5" y="39.5" width="7.5" height="5.5" rx="2.6" fill="var(--m-deep)"/><rect x="28" y="39.5" width="7.5" height="5.5" rx="2.6" fill="var(--m-deep)"/>
      <rect x="6" y="10" width="36" height="32" rx="9" fill="var(--m-body)"/>
      <rect x="10" y="14" width="28" height="14.5" rx="5" fill="#fff" opacity=".2"/><rect x="10" y="30.5" width="28" height="8" rx="4" fill="#fff" opacity=".2"/>
      <ellipse cx="18.5" cy="21" rx="3.5" ry="4" fill="#fff"/><ellipse cx="29.5" cy="21" rx="3.5" ry="4" fill="#fff"/>
      <circle cx="19" cy="21.6" r="2.05" fill="var(--m-ink)"/><circle cx="30" cy="21.6" r="2.05" fill="var(--m-ink)"/>
      <circle cx="19.8" cy="20.7" r=".7" fill="#fff"/><circle cx="30.8" cy="20.7" r=".7" fill="#fff"/>
      <path d="M20.5 33.4q3.5 3 7 0" stroke="var(--m-ink)" stroke-width="2.3" stroke-linecap="round" fill="none"/>
    </svg>
    <b>Thought Drawer</b>
    <span class="grow"></span>
    <button type="button" class="icon-btn" id="open-app" title="앱 열기" aria-label="앱 열기" hidden></button>
    <button type="button" class="avatar" id="account" aria-haspopup="menu" aria-expanded="false" hidden></button>
  </header>
  <main id="view" aria-live="polite"></main>
</body>
</html>
